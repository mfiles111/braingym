<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brain Games Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 2rem; }
    h1 { text-align: center; margin-bottom: 2rem; color: #38bdf8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; max-width: 1200px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 16px; padding: 1.5rem; text-align: center; border: 1px solid #334155; transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); border-color: #38bdf8; }
    .card h3 { margin-bottom: 0.5rem; color: #e2e8f0; }
    .card p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1rem; }
    .play-btn { background: #38bdf8; color: #0f172a; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: bold; cursor: pointer; }
    
    /* Modal Launcher */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 1000; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: #0f172a; width: 92%; max-width: 720px; height: 88vh; border-radius: 16px; position: relative; overflow: hidden; display: flex; flex-direction: column; }
    .close-btn { position: absolute; top: 12px; right: 16px; background: #ef4444; color: white; border: none; font-size: 0.9rem; padding: 6px 12px; border-radius: 6px; cursor: pointer; z-index: 1001; font-weight: bold; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <h1>🧠 Mind Gym Arcade</h1>
  <div class="grid" id="game-grid"></div>

  <div class="modal" id="game-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeGame()">✕ Close Game</button>
      <iframe id="game-frame" src=""></iframe>
    </div>
  </div>

  <script>
    const games = [
      { title: "Grid Memory Runner", desc: "Memorize path sequences across 30 scaling levels.", file: "games/grid-runner.html" },
      { title: "Color-Sound Simon Says", desc: "Pattern recall with dynamically shifting brain rules.", file: "games/color-says.html" },
      { title: "Mystery Tray", desc: "Identify missing or new items on the detective tray.", file: "games/mystery-tray.html" },
      { title: "Pattern Matrix Memory", desc: "Spatial memory grid expansion challenge.", file: "games/pattern-matrix.html" },
      { title: "Dual N-Back", desc: "Simultaneous spatial and auditory working memory training.", file: "games/dual-nback.html" }
      // Add entries for games 6-10 here following the same structure
    ];

    const grid = document.getElementById('game-grid');
    games.forEach(g => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<h3>${g.title}</h3><p>${g.desc}</p><button class="play-btn" onclick="launchGame('${g.file}')">Play Now 🚀</button>`;
      grid.appendChild(card);
    });

    function launchGame(file) {
      document.getElementById('game-frame').src = file;
      document.getElementById('game-modal').classList.add('active');
    }
    function closeGame() {
      document.getElementById('game-modal').classList.remove('active');
      document.getElementById('game-frame').src = '';
    }
  </script>
</body>
</html>
